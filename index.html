<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Cake Recipe AI Generator</title>
  </head>
  <body>
    <div class="container">
      <h1>Lemon Poppy Seed recipe</h1>

      <div class="cake-illustration">
        <svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="200" cy="238" rx="140" ry="16" fill="#e8e4d8" />

          <rect
            x="110"
            y="140"
            width="180"
            height="88"
            rx="14"
            fill="#fdf1c4"
          />
          <g fill="#fffef2">
            <rect x="105" y="132" width="190" height="18" rx="9" />
            <circle cx="120" cy="150" r="8" />
            <circle cx="150" cy="154" r="7" />
            <circle cx="180" cy="150" r="8" />
            <circle cx="210" cy="156" r="7" />
            <circle cx="240" cy="150" r="8" />
            <circle cx="270" cy="154" r="7" />
          </g>

          <rect x="140" y="82" width="120" height="66" rx="12" fill="#fff8e1" />
          <g fill="#fffef2">
            <rect x="135" y="76" width="130" height="16" rx="8" />
            <circle cx="150" cy="92" r="6" />
            <circle cx="175" cy="95" r="5" />
            <circle cx="200" cy="91" r="6" />
            <circle cx="225" cy="95" r="5" />
            <circle cx="250" cy="92" r="6" />
          </g>

          <g fill="#2b2b2b" opacity="0.85">
            <circle cx="130" cy="180" r="2" />
            <circle cx="155" cy="200" r="1.8" />
            <circle cx="175" cy="170" r="2" />
            <circle cx="200" cy="210" r="1.8" />
            <circle cx="225" cy="185" r="2" />
            <circle cx="250" cy="205" r="1.8" />
            <circle cx="270" cy="175" r="2" />
            <circle cx="160" cy="110" r="1.6" />
            <circle cx="190" cy="125" r="1.6" />
            <circle cx="220" cy="112" r="1.6" />
            <circle cx="240" cy="128" r="1.6" />
          </g>

          <circle
            cx="200"
            cy="55"
            r="26"
            fill="#fdec6b"
            stroke="#e8b923"
            stroke-width="5"
          />
          <circle cx="200" cy="55" r="19" fill="#fff9c4" />
          <g stroke="#f5e28a" stroke-width="2">
            <line x1="200" y1="55" x2="200" y2="36" />
            <line x1="200" y1="55" x2="216" y2="45" />
            <line x1="200" y1="55" x2="216" y2="65" />
            <line x1="200" y1="55" x2="200" y2="74" />
            <line x1="200" y1="55" x2="184" y2="65" />
            <line x1="200" y1="55" x2="184" y2="45" />
          </g>

          <g transform="translate(300,150)">
            <ellipse cx="28" cy="70" rx="36" ry="8" fill="#e8e4d8" />
            <path d="M-4,0 L58,0 L66,58 L-10,58 Z" fill="#fdf1c4" />
            <rect
              x="-4"
              y="18"
              width="70"
              height="10"
              fill="#fff3b0"
              opacity="0.7"
            />
            <rect x="-6" y="-6" width="72" height="10" rx="5" fill="#fffef2" />
            <g fill="#2b2b2b" opacity="0.85">
              <circle cx="15" cy="15" r="1.6" />
              <circle cx="35" cy="22" r="1.6" />
              <circle cx="25" cy="35" r="1.6" />
              <circle cx="45" cy="40" r="1.6" />
              <circle cx="10" cy="45" r="1.6" />
            </g>
          </g>
        </svg>
      </div>

      <main>
        <div class="form-container">
          <form id="recipe-generator-form">
            <textarea
               placeholder="a recipe of your choice"
               autofocus
               required
               autocomplete="off"
               class="instructions"
               id="user-instruction"
></textarea>
            <input type="submit" class="submit-button" value="Generate" />
          </form>
          <div class="hint">
            i.e "Butter cream", "Cream cheese", "Ganache or Royal icing"
          </div>
        </div>
        <div class="recipe hidden" id="recipe"></div>
      </main>
<footer>

</footer>
<script src="index.js"></script>
</body>
</html>
